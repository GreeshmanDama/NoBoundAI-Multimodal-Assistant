services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks: [nobound]

  chroma:
    image: chromadb/chroma:1.5.3
    restart: unless-stopped
    command: ["run", "--host", "0.0.0.0", "--port", "8000", "--path", "/data"]
    ports:
      - "127.0.0.1:8006:8000"
    volumes:
      - chroma_data:/data
    networks: [nobound]

  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - freellmapi_data:/app/server/data
    networks: [nobound]

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    networks: [nobound]

networks:
  nobound:

volumes:
  redis_data:
  chroma_data:
  freellmapi_data:
    external: true
    name: freellmapi_freellmapi-data