
services:
  redis:
    image: redis:7-alpine
    container_name: nobound-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  chroma:
    image: chromadb/chroma:1.5.3
    container_name: nobound-chroma
    restart: unless-stopped
    command: ["run", "--host", "0.0.0.0", "--port", "8000", "--path", "/data"]
    volumes:
      - ./data/vector_store:/data
    ports:
      - "127.0.0.1:8006:8000"

volumes:
  redis_data:
