name: Deploy NoBound AI to AWS EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: noboundai-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            cd ~/cortexAI
            chmod +x deploy.sh
            ./deploy.sh